---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  test:
    needs: [gomodule]
    uses: suzuki-shunsuke/go-test-full-workflow/.github/workflows/test.yaml@8e6155052a645b80a1dd9bf8d4f2668714977ca8 # v6.2.0
    with:
      aqua_version: v2.64.0
      gomodule_artifact_name: gomodule
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: write
      contents: read # To checkout private repository
      id-token: write

  # Download Go modules once and share them with integration-test and test
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@dc4640ee5d5a7bea22008b5eac92a560ce90f1fb # v0.0.7
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
      aqua_packages: go-licenses # go-test-full-workflow requires go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  integration-test:
    runs-on: ubuntu-26.04
    needs: [gomodule]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@dc4640ee5d5a7bea22008b5eac92a560ce90f1fb # v0.0.7

      - run: go install ./cmd/cmdx
      - run: cmdx help
